<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際探險者：地球歸途</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0a0a2a 0%, #000033 100%);
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* 移動控制 - 完全重構 */
        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }
        
        .control-row {
            display: flex;
            flex: 1;
            margin-bottom: 10px;
        }
        
        .control-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .joystick-area {
            position: relative;
            width: 150px;
            height: 150px;
        }
        
        .joystick-base {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(30, 40, 90, 0.3);
            border: 2px solid rgba(74, 91, 199, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .joystick-handle {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(74, 91, 199, 0.9);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.1s;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
        }
        
        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(30, 40, 90, 0.8);
            border: 3px solid #4a5bc7;
            color: #c2e0ff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }
        
        .action-btn:active {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.9);
            border-color: #5a6bd7;
        }
        
        .action-btn.pressed {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.9);
            border-color: #5a6bd7;
        }
        
        .action-btn.double {
            grid-column: span 2;
            width: 180px;
            height: 80px;
            border-radius: 40px;
        }
        
        .btn-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #a0b0ff;
            white-space: nowrap;
            pointer-events: none;
        }
        
        .btn-touch-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: touchRipple 0.3s ease-out;
        }
        
        @keyframes touchRipple {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
        
        /* 狀態顯示 */
        .status-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(15, 20, 50, 0.8);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #3a4b8a;
            pointer-events: auto;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-icon {
            font-size: 16px;
        }
        
        .stat-value {
            font-weight: bold;
            color: #4fc3f7;
        }
        
        .resource-bar {
            height: 10px;
            background: rgba(20, 30, 70, 0.8);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 2px;
            position: relative;
        }
        
        .resource-fill {
            height: 100%;
            transition: width 0.3s;
        }
        
        .health-fill {
            background: linear-gradient(to right, #4caf50, #8bc34a);
        }
        
        .fuel-fill {
            background: linear-gradient(to right, #ff9800, #ff5722);
        }
        
        .energy-fill {
            background: linear-gradient(to right, #2196f3, #03a9f4);
        }
        
        /* 對話框 */
        .dialog-box {
            position: absolute;
            bottom: 35vh;
            left: 10px;
            right: 10px;
            background: rgba(15, 20, 50, 0.95);
            border-radius: 10px;
            padding: 15px;
            border: 2px solid #4a5bc7;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.5);
        }
        
        .dialog-title {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .dialog-text {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .dialog-choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .dialog-choice {
            background: rgba(30, 40, 90, 0.8);
            border: 1px solid #4a5bc7;
            color: #c2e0ff;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .dialog-choice:active {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.98);
        }
        
        /* 戰鬥界面 */
        .battle-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3;
            pointer-events: auto;
        }
        
        .enemy-info {
            background: rgba(30, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ff5252;
            width: 80%;
            max-width: 300px;
        }
        
        .battle-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 350px;
        }
        
        .battle-action {
            background: rgba(30, 40, 90, 0.9);
            border: 2px solid #4a5bc7;
            color: #c2e0ff;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 1.1rem;
            transition: all 0.1s;
        }
        
        .battle-action:active {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.95);
        }
        
        .battle-log {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            height: 120px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dotted #333;
        }
        
        /* 物品欄 */
        .inventory {
            position: absolute;
            top: 60px;
            right: 10px;
            width: 200px;
            background: rgba(15, 20, 50, 0.95);
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #3a4b8a;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(0, 100, 255, 0.3);
        }
        
        .inventory-title {
            color: #4fc3f7;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .inventory-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .inventory-item {
            background: rgba(30, 40, 90, 0.8);
            border: 1px solid #3a4b8a;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.1s;
        }
        
        .inventory-item:active {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.95);
        }
        
        /* 小地圖 */
        .minimap {
            position: absolute;
            top: 60px;
            left: 10px;
            width: 120px;
            height: 120px;
            background: rgba(15, 20, 50, 0.8);
            border-radius: 10px;
            border: 1px solid #3a4b8a;
            overflow: hidden;
        }
        
        .minimap-player {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #4fc3f7;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        /* 通知 */
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 20, 50, 0.95);
            padding: 20px 30px;
            border-radius: 12px;
            border: 2px solid #4fc3f7;
            z-index: 10;
            display: none;
            pointer-events: none;
            animation: fadeInOut 2s ease;
            text-align: center;
            min-width: 200px;
            max-width: 300px;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            20% { opacity: 1; transform: translate(-50%, -50%); }
            80% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -60%); }
        }
        
        /* 能力按鈕 */
        .ability-btn {
            position: absolute;
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(100, 0, 200, 0.8);
            border: 3px solid #c5a3ff;
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 2;
            transition: all 0.1s;
        }
        
        .ability-btn:active {
            transform: translateX(-50%) scale(0.9);
            background: rgba(120, 20, 220, 0.9);
        }
        
        .ability-btn.cooldown {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 音樂控制 */
        .music-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
            z-index: 4;
        }
        
        .music-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(15, 20, 50, 0.8);
            border: 2px solid #4a5bc7;
            color: #c2e0ff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .music-btn:active {
            background: rgba(40, 60, 140, 0.9);
            transform: scale(0.95);
        }
        
        .music-btn.muted {
            opacity: 0.5;
        }
        
        /* 觸控引導 */
        .touch-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        
        .guide-content {
            background: rgba(15, 20, 50, 0.95);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #4a5bc7;
            max-width: 350px;
            text-align: center;
        }
        
        .guide-gesture {
            font-size: 48px;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 控制提示 */
        .control-hint {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            pointer-events: none;
            z-index: 2;
        }
        
        /* 響應式調整 */
        @media (max-width: 768px) {
            .joystick-area {
                width: 130px;
                height: 130px;
            }
            
            .joystick-base {
                width: 100px;
                height: 100px;
            }
            
            .joystick-handle {
                width: 50px;
                height: 50px;
            }
            
            .action-btn {
                width: 70px;
                height: 70px;
                font-size: 22px;
            }
            
            .action-btn.double {
                width: 160px;
                height: 70px;
            }
            
            .ability-btn {
                width: 70px;
                height: 70px;
                font-size: 12px;
            }
            
            .music-btn {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .joystick-area {
                width: 110px;
                height: 110px;
            }
            
            .joystick-base {
                width: 90px;
                height: 90px;
            }
            
            .joystick-handle {
                width: 45px;
                height: 45px;
            }
            
            .action-btn {
                width: 65px;
                height: 65px;
                font-size: 20px;
            }
            
            .action-btn.double {
                width: 140px;
                height: 65px;
            }
            
            .battle-actions {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .battle-action {
                padding: 18px;
            }
            
            .minimap {
                width: 100px;
                height: 100px;
            }
            
            .inventory {
                width: 180px;
            }
            
            .music-controls {
                top: 5px;
                right: 5px;
            }
            
            .music-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
        
        @media (max-height: 700px) {
            .touch-controls {
                height: 40vh;
            }
            
            .dialog-box {
                bottom: 40vh;
            }
        }
        
        /* 按鈕狀態指示器 */
        .btn-state {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: none;
        }
        
        .btn-state.active {
            display: block;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 音量控制 */
        .volume-slider {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 30px;
            height: 120px;
            background: rgba(15, 20, 50, 0.9);
            border-radius: 15px;
            border: 1px solid #3a4b8a;
            padding: 10px 0;
            display: none;
            pointer-events: auto;
        }
        
        .volume-track {
            position: relative;
            width: 8px;
            height: 100px;
            background: rgba(20, 30, 70, 0.8);
            border-radius: 4px;
            margin: 0 auto;
        }
        
        .volume-thumb {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #4fc3f7;
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <!-- 狀態欄 -->
            <div class="status-bar">
                <div class="stats">
                    <div class="stat">
                        <span class="stat-icon">❤️</span>
                        <span class="stat-value" id="healthValue">100</span>
                        <div class="btn-state" id="healthState"></div>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">⛽</span>
                        <span class="stat-value" id="fuelValue">60</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">⚡</span>
                        <span class="stat-value" id="energyValue">80</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">💰</span>
                        <span class="stat-value" id="creditsValue">50</span>
                    </div>
                    <div class="stat">
                        <span class="stat-icon">⭐</span>
                        <span class="stat-value" id="levelValue">1</span>
                    </div>
                </div>
                <div class="resource-bar" id="healthBarContainer">
                    <div class="resource-fill health-fill" id="healthBar" style="width: 100%"></div>
                </div>
                <div class="resource-bar" id="fuelBarContainer">
                    <div class="resource-fill fuel-fill" id="fuelBar" style="width: 60%"></div>
                </div>
                <div class="resource-bar" id="energyBarContainer">
                    <div class="resource-fill energy-fill" id="energyBar" style="width: 80%"></div>
                </div>
            </div>
            
            <!-- 小地圖 -->
            <div class="minimap">
                <div class="minimap-player" id="minimapPlayer"></div>
            </div>
            
            <!-- 物品欄 -->
            <div class="inventory" id="inventoryPanel">
                <div class="inventory-title">物品欄</div>
                <div class="inventory-items" id="inventoryItems">
                    <!-- 物品將由JS動態生成 -->
                </div>
            </div>
            
            <!-- 對話框 -->
            <div class="dialog-box" id="dialogBox">
                <div class="dialog-title" id="dialogTitle">對話</div>
                <div class="dialog-text" id="dialogText"></div>
                <div class="dialog-choices" id="dialogChoices"></div>
            </div>
            
            <!-- 戰鬥界面 -->
            <div class="battle-ui" id="battleUI">
                <div class="enemy-info" id="enemyInfo">
                    <h3 id="enemyName">太空海盜</h3>
                    <div class="resource-bar">
                        <div class="resource-fill health-fill" id="enemyHealthBar" style="width: 100%"></div>
                    </div>
                </div>
                
                <div class="battle-actions" id="battleActions">
                    <!-- 戰鬥行動將由JS動態生成 -->
                </div>
                
                <div class="battle-log" id="battleLog">
                    <!-- 戰鬥記錄將由JS動態生成 -->
                </div>
            </div>
            
            <!-- 音樂控制 -->
            <div class="music-controls">
                <button class="music-btn" id="musicToggleBtn" title="音樂開關">♪</button>
                <button class="music-btn" id="soundToggleBtn" title="音效開關">🔊</button>
            </div>
            
            <!-- 音量控制 -->
            <div class="volume-slider" id="volumeSlider">
                <div class="volume-track">
                    <div class="volume-thumb" id="volumeThumb"></div>
                </div>
            </div>
            
            <!-- 能力按鈕 -->
            <button class="ability-btn" id="dashBtn" title="衝刺">衝刺</button>
            
            <!-- 通知 -->
            <div class="notification" id="notification"></div>
            
            <!-- 觸控控制 -->
            <div class="touch-controls">
                <div class="control-row">
                    <div class="control-section">
                        <div class="joystick-area" id="joystickArea">
                            <div class="joystick-base"></div>
                            <div class="joystick-handle" id="joystickHandle"></div>
                        </div>
                    </div>
                    
                    <div class="control-section">
                        <div class="action-buttons">
                            <button class="action-btn" id="actionBtn" data-label="互動">
                                ✨
                                <span class="btn-label">互動</span>
                            </button>
                            <button class="action-btn" id="jumpBtn" data-label="跳躍">
                                ⬆️
                                <span class="btn-label">跳躍</span>
                            </button>
                            <button class="action-btn double" id="inventoryBtn" data-label="物品欄">
                                🎒 物品欄
                                <span class="btn-label"></span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="control-hint">
                    虛擬搖桿控制移動 | 點擊按鈕執行動作
                </div>
            </div>
            
            <!-- 觸控引導 -->
            <div class="touch-guide" id="touchGuide">
                <div class="guide-content">
                    <h3>星際探險者：地球歸途</h3>
                    <p>使用左側虛擬搖桿移動角色</p>
                    <div class="guide-gesture">🕹️</div>
                    <p>右側按鈕功能：</p>
                    <p>✨ 互動 - 與NPC對話或收集物品</p>
                    <p>⬆️ 跳躍 - 跳過障礙物</p>
                    <p>🎒 物品欄 - 查看和使用物品</p>
                    <p>衝刺按鈕 - 快速移動（消耗能量）</p>
                    <p>右上角按鈕可控制音樂和音效</p>
                    <button class="action-btn double" id="startGameBtn" style="margin-top: 20px;">
                        開始冒險
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 音效元素 -->
    <audio id="bgMusic" loop></audio>
    <audio id="battleMusic" loop></audio>
    <audio id="clickSound"></audio>
    <audio id="jumpSound"></audio>

                if (!gameState.soundEnabled) return;
                
                const sound = this.sounds[soundName];
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log('音效播放失敗:', e));
                }

            playBackgroundMusic: function() {
                if (!gameState.musicEnabled || this.bgMusic.paused) {
                    this.bgMusic.play().catch(e => console.log('背景音樂播放失敗:', e));
                }
            },
            
            playBattleMusic: function() {
                if (!gameState.musicEnabled || this.battleMusic.paused) {
                    this.bgMusic.pause();
                    this.battleMusic.currentTime = 0;
                    this.battleMusic.play().catch(e => console.log('戰鬥音樂播放失敗:', e));
                }
            },
            
            stopBattleMusic: function() {
                this.battleMusic.pause();
                if (!this.bgMusic.paused) return;
                this.bgMusic.play().catch(e => console.log('背景音樂播放失敗:', e));
            },
            
            stopAllMusic: function() {
                this.bgMusic.pause();
                this.battleMusic.pause();

                gameState.musicVolume = volume;
                this.bgMusic.volume = volume;
                this.battleMusic.volume = volume * 0.8;

            setSoundVolume: function(volume) {
                gameState.soundVolume = volume;
                Object.values(this.sounds).forEach(sound => {
                    sound.volume = volume;
                });
            },
            
            toggleMusic: function() {
                gameState.musicEnabled = !gameState.musicEnabled;
                if (gameState.musicEnabled) {
                    this.playBackgroundMusic();
                } else {
                    this.stopAllMusic();

        // 初始化遊戲
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            audioManager.init();
            
            // 設置觸控事件
            setupTouchControls();
            
            // 設置音樂控制
            setupMusicControls();
            
            // 載入遊戲進度
            if (!loadGame()) {
                // 顯示觸控引導
                showTouchGuide();
            } else {
                // 播放背景音樂
                if (gameState.musicEnabled) {
                    audioManager.playBackgroundMusic();
                }

            requestAnimationFrame(gameLoop);
